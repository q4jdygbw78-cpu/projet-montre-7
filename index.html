<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HorloMarket Tracker - Haute Horlogerie</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: #121620;
            --panel-border: #1e2538;
            --gold: #d4af37;
            --gold-dark: #aa8416;
            --text-main: #ffffff;
            --text-muted: #8a94a6;
            --green: #00e676;
            --red: #ff1744;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* INTERFACE PRINCIPALE */
        .app-container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 100;
        }

        .menu-toggle, .search-toggle {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .menu-toggle svg, .search-toggle svg {
            fill: var(--text-main);
            width: 26px;
            height: 26px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo svg {
            fill: var(--gold);
            width: 32px;
            height: 32px;
        }

        .brand-logo h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--gold);
            text-transform: uppercase;
        }

        /* BARRE DE RECHERCHE DEPLOYABLE */
        .search-bar-container {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background-color: var(--panel-bg);
            box-sizing: border-box;
            padding: 10px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: none;
        }

        .search-bar-container.active {
            display: block;
        }

        .search-bar-container input {
            width: 100%;
            box-sizing: border-box;
            background-color: var(--bg-dark);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        /* MENU LATERAL DES MARQUES */
        .brands-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--panel-bg);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            z-index: 500;
            transition: left 0.3s ease;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .brands-drawer.open {
            left: 0;
        }

        .drawer-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid var(--panel-border);
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .brands-list {
            list-style: none;
            padding: 10px 0;
            margin: 0;
            overflow-y: auto;
            height: calc(100% - 50px);
        }

        .brands-list li {
            padding: 14px 20px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
            border-left: 3px solid transparent;
            color: var(--text-main);
        }

        .brands-list li:hover, .brands-list li.active {
            background: rgba(212, 175, 55, 0.05);
            color: var(--gold);
            border-left-color: var(--gold);
        }

        /* STRUCTURE & CONTENU */
        .main-layout {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 63px);
        }

        .sidebar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            max-height: 130px;
            overflow-x: auto;
            display: flex;
            gap: 12px;
            padding: 12px;
        }

        .watch-card {
            background-color: var(--bg-dark);
            border: 1px solid var(--panel-border);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            min-width: 160px;
            flex-shrink: 0;
        }

        .watch-card.active {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.02);
        }

        .card-brand { font-size: 0.65rem; color: var(--gold); text-transform: uppercase; }
        .card-title { font-size: 0.85rem; font-weight: 600; margin: 2px 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .card-footer { display: flex; justify-content: space-between; font-size: 0.75rem; }

        .content {
            padding: 15px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hero-section {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 15px;
            background-color: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            align-items: center;
        }

        .watch-img-container {
            width: 110px;
            height: 110px;
            background-color: #0d1017;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        .watch-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .metric-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-box h3 { margin: 0 0 5px 0; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .metric-box p { margin: 0; font-size: 1.1rem; font-weight: bold; color: #fff; }

        .chart-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 15px;
            border-radius: 8px;
            height: 200px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 400;
            display: none;
        }

        @media (min-width: 768px) {
            .main-layout { grid-template-columns: 320px 1fr; display: grid; }
            .sidebar { flex-direction: column; max-height: none; overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--panel-border); }
            .hero-section { grid-template-columns: 180px 1fr; padding: 25px; }
            .watch-img-container { width: 180px; height: 180px; }
            .metrics-grid { grid-template-columns: repeat(4, 1fr); }
            .chart-container { height: 320px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="menuOverlay" onclick="toggleMenu()"></div>

    <div class="brands-drawer" id="brandsDrawer">
        <div class="drawer-header">
            <span>Marques de Prestige</span>
            <button class="drawer-close" onclick="toggleMenu()">✕</button>
        </div>
        <ul class="brands-list" id="drawerBrandsList"></ul>
    </div>

    <div class="app-container" id="appInterface">
        <div class="navbar">
            <button class="menu-toggle" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/></svg>
            </button>
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M4,5L7,11L12,4L17,11L20,5L18,18H6L4,5M12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17A2,2 0 0,0 14,15A2,2 0 0,0 12,13Z"/>
                </svg>
                <h1>HorloMarket</h1>
            </div>
            <button class="search-toggle" onclick="toggleSearch()">
                <svg viewBox="0 0 24 24"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/></svg>
            </button>

            <div class="search-bar-container" id="searchBarBox">
                <input type="text" id="searchInput" placeholder="Rechercher un modèle..." oninput="filterWatches()">
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar" id="sidebarList"></div>

            <div class="content">
                <div class="hero-section">
                    <div class="watch-img-container">
                        <img id="viewImage" src="" alt="Montre">
                    </div>
                    <div>
                        <h2 id="viewBrand" style="color: var(--gold); margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;">Marque</h2>
                        <h1 id="viewModel" style="margin: 3px 0; font-size: 1.3rem; font-weight: 600; color: #fff;">Modèle</h1>
                        <p id="viewRef" style="color: var(--text-muted); margin: 0; font-size: 0.8rem;"></p>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-box">
                        <h3>Cote Marché</h3>
                        <p id="mPrice">-</p>
                    </div>
                    <div class="metric-box">
                        <h3>Évolution (6m)</h3>
                        <p id="mTrend">-</p>
                    </div>
                    <div class="metric-box">
                        <h3>Indice Demande</h3>
                        <p id="mDemand">-</p>
                    </div>
                    <div class="metric-box">
                        <h3>Flux / mois</h3>
                        <p id="mVolume">-</p>
                    </div>
                </div>

                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const database = [
            { id: 1, brand: "Rolex", model: "Daytona 'Panda'", ref: "126500LN", price: 31500, trend: "+4.2%", trendDir: "up", demand: "Ultra Élevée", volume: 48, img: "https://images.unsplash.com/photo-1639006570490-79c0c53f1080?w=400&auto=format&fit=crop&q=80", history: [28500, 29200, 30000, 30800, 31100, 31500] },
            { id: 2, brand: "Rolex", model: "Submariner 'Starbucks'", ref: "126610LV", price: 16100, trend: "+1.8%", trendDir: "up", demand: "Très Haute", volume: 55, img: "https://images.unsplash.com/photo-1547996160-81dfa63595aa?w=400&auto=format&fit=crop&q=80", history: [15400, 15600, 15750, 15800, 15950, 16100] },
            { id: 3, brand: "Rolex", model: "GMT-Master II 'Pepsi'", ref: "126710BLRO", price: 22400, trend: "+3.5%", trendDir: "up", demand: "Saturée", volume: 32, img: "https://images.unsplash.com/photo-1622434641406-a158123450f9?w=400&auto=format&fit=crop&q=80", history: [21000, 21300, 21700, 22000, 22200, 22400] },
            { id: 4, brand: "Patek Philippe", model: "Nautilus Blue Dial", ref: "5711/1A-010", price: 118000, trend: "-1.4%", trendDir: "down", demand: "Exceptionnelle", volume: 4, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&auto=format&fit=crop&q=80", history: [121000, 120000, 119000, 118500, 118000, 118000] },
            { id: 5, brand: "Patek Philippe", model: "Aquanaut Travel Time", ref: "5164A", price: 72000, trend: "+2.0%", trendDir: "up", demand: "Très Élevée", volume: 8, img: "https://images.unsplash.com/photo-1533139502658-0198f920d8e8?w=400&auto=format&fit=crop&q=80", history: [69000, 70100, 70800, 71200, 71700, 72000] },
            { id: 6, brand: "Audemars Piguet", model: "Royal Oak 'Jumbo'", ref: "16202ST", price: 74500, trend: "+1.9%", trendDir: "up", demand: "Intense", volume: 11, img: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?w=400&auto=format&fit=crop&q=80", history: [72000, 72500, 73100, 73800, 74000, 74500] },
            { id: 7, brand: "Audemars Piguet", model: "Royal Oak Chronographe", ref: "26240ST", price: 51000, trend: "-0.8%", trendDir: "down", demand: "Forte", volume: 15, img: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=400&auto=format&fit=crop&q=80", history: [52000, 51800, 51500, 51300, 51000, 51000] },
            { id: 8, brand: "Richard Mille", model: "RM 67-02", ref: "RM67-02", price: 285000, trend: "+5.2%", trendDir: "up", demand: "Prestige", volume: 2, img: "https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=400&auto=format&fit=crop&q=80", history: [270000, 274000, 277000, 281000, 283000, 285000] },
            { id: 9, brand: "F.P. Journe", model: "Chronomètre Bleu", ref: "CB Tantalum", price: 89000, trend: "+8.5%", trendDir: "up", demand: "Collectionneurs", volume: 3, img: "https://images.unsplash.com/photo-1619134778706-7015533a6150?w=400&auto=format&fit=crop&q=80", history: [81000, 83500, 85000, 86800, 88000, 89000] },
            { id: 10, brand: "Vacheron Constantin", model: "Overseas", ref: "4500V", price: 29500, trend: "+1.1%", trendDir: "up", demand: "Stable Élevée", volume: 14, img: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400&auto=format&fit=crop&q=80", history: [28900, 29000, 29100, 29300, 29400, 29500] },
            { id: 11, brand: "A. Lange & Söhne", model: "Lange 1", ref: "191.032", price: 42300, trend: "+0.4%", trendDir: "up", demand: "Exclusive", volume: 5, img: "https://images.unsplash.com/photo-1612817159949-195b6eb9e31a?w=400&auto=format&fit=crop&q=80", history: [41900, 42000, 42100, 42200, 42300, 42300] },
            { id: 12, brand: "H. Moser & Cie", model: "Streamliner", ref: "6902-1200", price: 41000, trend: "+3.1%", trendDir: "up", demand: "Forte", volume: 7, img: "https://images.unsplash.com/photo-1509048191080-d2984bad6ae5?w=400&auto=format&fit=crop&q=80", history: [39000, 39600, 40100, 40400, 40700, 41000] },
            { id: 13, brand: "Omega", model: "Speedmaster", ref: "310.30.42", price: 7600, trend: "+0.9%", trendDir: "up", demand: "Historique", volume: 68, img: "https://images.unsplash.com/photo-1504274066651-8d31a536b11a?w=400&auto=format&fit=crop&q=80", history: [7400, 7450, 7500, 7520, 7560, 7600] },
            { id: 14, brand: "Cartier", model: "Santos", ref: "WSSA0039", price: 9100, trend: "+1.3%", trendDir: "up", demand: "Croissante", volume: 45, img: "https://images.unsplash.com/photo-1539874754764-5a96559165b0?w=400&auto=format&fit=crop&q=80", history: [8800, 8850, 8900, 8980, 9050, 9100] },
            { id: 15, brand: "Jaeger-LeCoultre", model: "Reverso", ref: "Q3978460", price: 10400, trend: "+2.2%", trendDir: "up", demand: "Élevée", volume: 22, img: "https://images.unsplash.com/photo-1434494878577-86c23bcb06b9?w=400&auto=format&fit=crop&q=80", history: [9900, 10000, 10150, 10250, 10300, 10400] }
        ];

        let chartInstance = null;
        const months = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin"];
        let currentSelectedBrand = "all";

        // Initialisation automatique au chargement
        window.onload = function() {
            buildBrandDrawer();
            filterWatches();
        };

        function buildBrandDrawer() {
            const listContainer = document.getElementById('drawerBrandsList');
            if(!listContainer) return;
            listContainer.innerHTML = "";

            const itemAll = document.createElement('li');
            itemAll.innerText = "Toutes les marques";
            itemAll.className = "active";
            itemAll.onclick = () => selectBrandFromDrawer("all", itemAll);
            listContainer.appendChild(itemAll);

            const brands = [...new Set(database.map(w => w.brand))];
            brands.forEach(b => {
                const li = document.createElement('li');
                li.innerText = b;
                li.onclick = () => selectBrandFromDrawer(b, li);
                listContainer.appendChild(li);
            });
        }

        function selectBrandFromDrawer(brand, element) {
            currentSelectedBrand = brand;
            document.querySelectorAll('.brands-list li').forEach(li => li.classList.remove('active'));
            element.classList.add('active');
            toggleMenu();
            filterWatches();
        }

        function toggleMenu() {
            const drawer = document.getElementById('brandsDrawer');
            const overlay = document.getElementById('menuOverlay');
            if(drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                drawer.classList.add('open');
                overlay.style.display = 'block';
            }
        }

        function toggleSearch() {
            const searchBox = document.getElementById('searchBarBox');
            searchBox.classList.toggle('active');
            if(searchBox.classList.contains('active')) {
                document.getElementById('searchInput').focus();
            }
        }

        function filterWatches() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const filtered = database.filter(watch => {
                const matchesSearch = watch.brand.toLowerCase().includes(searchVal) || 
                                      watch.model.toLowerCase().includes(searchVal) || 
                                      watch.ref.toLowerCase().includes(searchVal);
                const matchesBrand = currentSelectedBrand === "all" || watch.brand === currentSelectedBrand;
                return matchesSearch && matchesBrand;
            });
            displayList(filtered);
            if(filtered.length > 0) {
                selectWatch(filtered[0]);
            }
        }

        function displayList(watches) {
            const listContainer = document.getElementById('sidebarList');
            if(!listContainer) return;
            listContainer.innerHTML = "";
            
            watches.forEach((watch) => {
                const card = document.createElement('div');
                card.id = `card-${watch.id}`;
                card.className = "watch-card";
                card.innerHTML = `
                    <div class="card-brand">${watch.brand}</div>
                    <div class="card-title">${watch.model}</div>
                    <div class="card-footer">
                        <span style="color:var(--gold); font-weight:bold;">${watch.price.toLocaleString('fr-FR')} €</span>
                        <span style="color: ${watch.trendDir === 'up' ? 'var(--green)' : 'var(--red)'}">${watch.trend}</span>
                    </div>
                `;
                card.onclick = () => selectWatch(watch);
                listContainer.appendChild(card);
            });
        }

        function selectWatch(watch) {
            document.querySelectorAll('.watch-card').forEach(c => c.classList.remove('active'));
            const activeCard = document.getElementById(`card-${watch.id}`);
            if(activeCard) activeCard.classList.add('active');

            document.getElementById('viewBrand').innerText = watch.brand;
            document.getElementById('viewModel').innerText = watch.model;
            document.getElementById('viewRef').innerText = `Réf : ${watch.ref}`;
            document.getElementById('viewImage').src = watch.img;
            document.getElementById('mPrice').innerText = `${watch.price.toLocaleString('fr-FR')} €`;
            
            const trendBox = document.getElementById('mTrend');
            trendBox.innerText = watch.trend;
            trendBox.style.color = watch.trendDir === 'up' ? 'var(--green)' : 'var(--red)';
            
            document.getElementById('mDemand').innerText = watch.demand;
            document.getElementById('mVolume').innerText = `${watch.volume} u.`;

            // Graphique
            const canvas = document.getElementById('mainChart');
            if(!canvas) return;
            
            if (chartInstance) chartInstance.destroy();
            const ctx = canvas.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        data: watch.history,
                        borderColor: '#d4af37',
                        backgroundColor: 'rgba(212, 175, 55, 0.03)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1,
                        pointRadius: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { grid: { color: '#161d2d' }, ticks: { color: '#8a94a6', font: { size: 10 } } },
                        x: { grid: { color: '#161d2d' }, ticks: { color: '#8a94a6', font: { size: 10 } } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
